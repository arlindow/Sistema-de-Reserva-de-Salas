<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Reserva de Salas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div style="font-size:40px">🏢</div>
        <h1>Reserva de Salas</h1>
        <p>Faça login para continuar</p>
      </div>

      <div class="alert alert-error" id="erro"></div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input class="input" type="email" id="email" placeholder="seu@email.com" autofocus>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input class="input" type="password" id="senha" placeholder="••••••••">
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:4px" id="btnLogin">
        Entrar
      </button>

      <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)">
        admin@salas.com / admin123 &nbsp;|&nbsp; joao@salas.com / joao123
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redireciona se já está logado
    if (getToken()) {
      window.location.href = getUsuario()?.perfil === 'admin' ? '/pages/admin.html' : '/pages/dashboard.html';
    }

    const erro    = document.getElementById('erro');
    const btnLogin = document.getElementById('btnLogin');

    function mostrarErro(msg) {
      erro.textContent = msg;
      erro.classList.add('show');
    }

    async function fazerLogin() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      erro.classList.remove('show');

      if (!email || !senha) { mostrarErro('Preencha e-mail e senha.'); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Entrando...';

      try {
        const dados = await api.login(email, senha);
        localStorage.setItem('token',   dados.token);
        localStorage.setItem('usuario', JSON.stringify(dados.usuario));

        window.location.href = dados.usuario.perfil === 'admin'
          ? '/pages/admin.html'
          : '/pages/dashboard.html';
      } catch (e) {
        mostrarErro(e.message);
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar';
      }
    }

    btnLogin.addEventListener('click', fazerLogin);
    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') fazerLogin();
    });
  </script>
</body>
</html>
